<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 16" width="1024" height="32" shape-rendering="crispEdges">
  <defs>
    <pattern id="stone" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#bcbcbc"/>
      <!-- highlights -->
      <rect x="0" y="0" width="15" height="1" fill="#fcfcfc"/>
      <rect x="8" y="8" width="7" height="1" fill="#fcfcfc"/>
      <rect x="0" y="8" width="7" height="1" fill="#fcfcfc"/>
      <!-- mortar -->
      <rect x="0" y="7" width="16" height="1" fill="#000000"/>
      <rect x="0" y="15" width="16" height="1" fill="#000000"/>
      <rect x="15" y="0" width="1" height="7" fill="#000000"/>
      <rect x="7" y="8" width="1" height="7" fill="#000000"/>
      <!-- shade -->
      <rect x="14" y="1" width="1" height="6" fill="#7c7c7c"/>
      <rect x="6" y="9" width="1" height="6" fill="#7c7c7c"/>
    </pattern>
  </defs>
  <rect width="512" height="16" fill="url(#stone)"/>
</svg>
